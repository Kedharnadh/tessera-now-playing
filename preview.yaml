# What tools/preview.py shows (docs/PREVIEW.md): one player playing with its words, one that has nothing on, and a
# tile before a player is chosen. The moments count from the run, so the song is always at its first line.
tiles:
  - tile: player
    name: Living room
    entity: media_player.living_room
    options: { lyrics: sensor.now_playing_lyrics }

  - tile: player
    name: Nothing playing
    entity: media_player.bedroom
    sizes: [1x1, 2x1, 2x2]

  - tile: player
    name: Choose a player
    sizes: [1x1, 2x1, 3x2]

